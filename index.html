<!DOCTYPE html>

    <style>
        :root {

            --active-card-bg: #eff6ff;
            --active-card-border: #3b82f6;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-secondary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --active-card-bg: #1e3a8a;
            --active-card-border: #60a5fa;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .vocab-card {
            background-color: var(--bg-card);
            border-color: var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .vocab-card.is-reading {
            background-color: var(--active-card-bg) !important;
            border-color: var(--active-card-border) !important;
            border-width: 2px !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transform: scale(1.02);
        }

        .page-badge {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 0;
        }

        .details-content.open {
            max-height: 500px;
            opacity: 1;
        }

        .custom-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .custom-btn:hover {
            background-color: var(--bg-secondary);
        }

        .custom-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Pulse animation for reading status */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .reading-pulse {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>

            { page: 2, term: "to throw off the yoke", def: "To free oneself from oppressive control, tyranny, or foreign rule.", ger: "das Joch abwerfen" },
            { page: 2, term: "to acquire territory", def: "To gain ownership or administrative control over new lands.", ger: "Territorium erwerben" },

            // Page 3
            { page: 3, term: "large swaths of territory", def: "Vast strips or broad continuous areas of geographic land.", ger: "große Landstriche" },

        // State variables
        let currentItems = [...vocabDatabase];
        let currentPageFilter = 'all';
        let isGermanFront = false;
        let openCardIndex = null;
        let isReadingAll = false;
        let currentReadIndex = 0;
        let speechSynth = window.speechSynthesis;
        let EnglishVoice = null;
        let GermanVoice = null;

        // Initialize Web Speech Synthesis Voices
        function loadVoices() {
            if (!speechSynth) return;
            const voices = speechSynth.getVoices();
            EnglishVoice = voices.find(v => v.lang.startsWith('en-GB') || v.lang.startsWith('en-US') || v.lang.startsWith('en')) || null;
            GermanVoice = voices.find(v => v.lang.startsWith('de-DE') || v.lang.startsWith('de')) || null;
        }

        if (speechSynth) {
            loadVoices();
            if (speechSynth.onvoiceschanged !== undefined) {
                speechSynth.onvoiceschanged = loadVoices;
            }
        }

        // Render Vocabulary Grid
        function renderCards() {
            const grid = document.getElementById('vocabGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

            grid.innerHTML = '';

            let filtered = currentItems.filter(item => {
                const matchPage = currentPageFilter === 'all' || item.page.toString() === currentPageFilter;
                const matchSearch = !searchVal || 
                    item.term.toLowerCase().includes(searchVal) || 
                    item.def.toLowerCase().includes(searchVal) || 
                    item.ger.toLowerCase().includes(searchVal);
                return matchPage && matchSearch;
            });

            document.getElementById('visibleCount').innerText = filtered.length;
            document.getElementById('totalCount').innerText = vocabDatabase.length;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');
            }

            filtered.forEach((item, index) => {
                const isSearchActive = searchVal.length > 0;
                const isOpen = openCardIndex === index || isSearchActive;

                const cardHtml = `
                    <div id="card-${index}" class="vocab-card rounded-2xl border p-5 shadow-sm flex flex-col justify-between cursor-pointer relative" onclick="toggleCardDetails(${index})">
                        <div>
                            <div class="flex items-start justify-between gap-2 mb-3">
                                <span class="page-badge text-xs font-semibold px-2.5 py-1 rounded-md">Seite ${item.page}</span>
                                <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                                    <button onclick="speakWord('${escapeJsString(item.term)}', 'en', event)" class="p-2 rounded-lg text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-gray-800 transition-colors" title="Vorlesen (Englisch)">
                                        <i class="fas fa-volume-up"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Front Word -->
                            <div class="mb-2">
                                <h2 class="text-lg font-bold tracking-tight text-blue-600 dark:text-blue-400">
                                    ${isGermanFront ? item.ger : item.term}
                                </h2>
                                <p class="text-xs text-gray-400 mt-0.5">${isGermanFront ? 'Deutsch' : 'Englisch'}</p>
                            </div>

                            <!-- Foldable Content -->
                            <div id="details-${index}" class="details-content ${isOpen ? 'open' : ''} border-t border-gray-100 dark:border-gray-800 pt-3 mt-3">
                                <div class="mb-3">
                                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">
                                        ${isGermanFront ? 'Englisches Wort' : 'Deutsche Übersetzung'}
                                    </span>
                                    <p class="text-sm font-semibold text-gray-800 dark:text-gray-200">
                                        ${isGermanFront ? item.term : item.ger}
                                    </p>
                                </div>
                                <div>
                                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Definition (EN)</span>
                                    <p class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 leading-relaxed italic">
                                        "${item.def}"
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Card Footer Toggle Indicator -->
                        <div class="mt-4 pt-2 border-t border-gray-50 dark:border-gray-800/50 flex items-center justify-between text-xs text-gray-400">
                            <span>${isOpen ? 'Einklappen' : 'Klicken für Details'}</span>
                            <i class="fas fa-chevron-${isOpen ? 'up' : 'down'} transition-transform"></i>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // Toggle details
        function toggleCardDetails(index) {
            openCardIndex = (openCardIndex === index) ? null : index;
            renderCards();
        }

        // Helper to escape single quotes
        function escapeJsString(str) {
            return str.replace(/'/g, "\\'");
        }

        // Filter Page
        function filterPage(pageNum) {
            stopReadAll();
            currentPageFilter = pageNum;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${pageNum}`).classList.add('active');
            openCardIndex = null;
            renderCards();
        }

        // Search
        function handleSearch() {
            stopReadAll();
            const val = document.getElementById('searchInput').value;
            document.getElementById('clearSearch').classList.toggle('hidden', val.length === 0);
            renderCards();
        }

        function clearSearchInput() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').classList.add('hidden');
            renderCards();
        }

        // Controls
        function shuffleCards() {
            stopReadAll();
            for (let i = currentItems.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentItems[i], currentItems[j]] = [currentItems[j], currentItems[i]];
            }
            openCardIndex = null;
            renderCards();
        }

        function toggleCardFront() {
            isGermanFront = !isGermanFront;
            renderCards();
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            const icon = document.getElementById('themeIcon');
            icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // Speech Synthesis - Single Word
        function speakWord(text, lang = 'en', event = null) {
            if (event) event.stopPropagation();
            if (!speechSynth) {
                alert('Sprachausgabe wird in diesem Browser leider nicht unterstützt.');
                return;
            }

            speechSynth.cancel(); // Stop active speaking

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;

            if (lang === 'en') {
                utterance.lang = 'en-US';
                if (EnglishVoice) utterance.voice = EnglishVoice;
            } else if (lang === 'de') {
                utterance.lang = 'de-DE';
                if (GermanVoice) utterance.voice = GermanVoice;
            }

            speechSynth.speak(utterance);
        }

        // Sequential Read-Aloud (Alle nacheinander vorlesen)
        function toggleReadAll() {
            if (isReadingAll) {
                stopReadAll();
            } else {
                startReadAll();
            }
        }

        function startReadAll() {
            if (!speechSynth) {
                alert('Sprachausgabe wird in diesem Browser leider nicht unterstützt.');
                return;
            }

            const visibleCards = getVisibleVocabList();
            if (visibleCards.length === 0) return;

            isReadingAll = true;
            currentReadIndex = 0;
            updateReadAllUI(true);
            readNextCard();
        }

        function stopReadAll() {
            isReadingAll = false;
            if (speechSynth) speechSynth.cancel();
            clearCardHighlights();
            updateReadAllUI(false);
        }

        function getVisibleVocabList() {
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            return currentItems.filter(item => {
                const matchPage = currentPageFilter === 'all' || item.page.toString() === currentPageFilter;
                const matchSearch = !searchVal || 
                    item.term.toLowerCase().includes(searchVal) || 
                    item.def.toLowerCase().includes(searchVal) || 
                    item.ger.toLowerCase().includes(searchVal);
                return matchPage && matchSearch;
            });
        }

        function readNextCard() {
            if (!isReadingAll) return;

            const visibleCards = getVisibleVocabList();

            if (currentReadIndex >= visibleCards.length) {
                stopReadAll();
                return;
            }

            const item = visibleCards[currentReadIndex];

            // Highlight & scroll card
            highlightCard(currentReadIndex);
            
            document.getElementById('currentReadIndex').innerText = currentReadIndex + 1;
            document.getElementById('totalReadCount').innerText = visibleCards.length;

            // Step 1: Speak English Term
            const englishUtterance = new SpeechSynthesisUtterance(item.term);
            englishUtterance.lang = 'en-US';
            if (EnglishVoice) englishUtterance.voice = EnglishVoice;
            englishUtterance.rate = 0.9;

            englishUtterance.onend = () => {
                if (!isReadingAll) return;

                // Brief pause before reading German translation
                setTimeout(() => {
                    if (!isReadingAll) return;

                    // Step 2: Speak German Translation
                    const germanUtterance = new SpeechSynthesisUtterance(item.ger);
                    germanUtterance.lang = 'de-DE';
                    if (GermanVoice) germanUtterance.voice = GermanVoice;
                    germanUtterance.rate = 0.9;

                    germanUtterance.onend = () => {
                        if (!isReadingAll) return;

                        // Brief pause before moving to next card
                        setTimeout(() => {
                            if (isReadingAll) {
                                currentReadIndex++;
                                readNextCard();
                            }
                        }, 800);
                    };

                    speechSynth.speak(germanUtterance);
                }, 400);
            };

            speechSynth.speak(englishUtterance);
        }

        function highlightCard(index) {
            clearCardHighlights();

            const cardElem = document.getElementById(`card-${index}`);
            if (cardElem) {
                cardElem.classList.add('is-reading');
                
                // Ensure card details are visible while reading
                const details = document.getElementById(`details-${index}`);
                if (details) details.classList.add('open');

                // Smooth scroll to card
                cardElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function clearCardHighlights() {
            document.querySelectorAll('.vocab-card').forEach(card => {
                card.classList.remove('is-reading');
            });
        }

        function updateReadAllUI(active) {
            const btn = document.getElementById('toggleAllAudioBtn');
            const icon = document.getElementById('allAudioIcon');
            const text = document.getElementById('allAudioText');
            const progress = document.getElementById('readProgress');

            if (active) {
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                btn.classList.add('bg-red-600', 'hover:bg-red-700', 'reading-pulse');
                icon.className = 'fas fa-stop';
                text.innerText = '⏹️ Stopp';
                progress.classList.remove('hidden');
            } else {
                btn.classList.remove('bg-red-600', 'hover:bg-red-700', 'reading-pulse');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                icon.className = 'fas fa-play';
                text.innerText = '▶️ Alle nacheinander vorlesen';
                progress.classList.add('hidden');
            }
        }

        // Initialize App on load
        window.onload = function() {
            renderCards();
        };
    </script>
</body>
</html>
